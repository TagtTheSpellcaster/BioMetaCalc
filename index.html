<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BioMetaCalc: BMI, body composition, calorie needs, weight-loss planning, training logs and nutrition calculators in one offline web app.">
    <meta name="theme-color" content="#1a7f45">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
    <title>BioMetaCalc</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg
xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a7f45'/%3E%3Cpath d='M6 21l6-7 5 4 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f5f0;
        --surface: #fff;
        --surface-2: #e9efe8;
        --tint: #e3f1e8;
        --line: #d6dfd4;
        --line-soft: #e6ece4;
        --ink: #11211a;
        --ink-2: #46574d;
        --ink-3: #74847a;
        --accent: #1a7f45;
        --accent-strong: #14663a;
        --accent-ink: #fff;
        --accent-soft: #dcefe3;
        --warn: #8a5200;
        --warn-bg: #fff3d6;
        --bad: #b3261e;
        --ok: #1a7f45;
        --s1: #1a7f45;
        --s2: #46574d;
        --fat: #9aa89f;
        --side: #10231a;
        --side-ink: #cfe0d5;
        --side-dim: #8fa597;
        --side-line: #1d3427;
        --side-on: #1f4a31;
      }

      @media (prefers-color-scheme:dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --bg: #0e1411;
          --surface: #151c18;
          --surface-2: #1e2822;
          --tint: #173325;
          --line: #2a362e;
          --line-soft: #222d26;
          --ink: #e9f1ec;
          --ink-2: #aebcb3;
          --ink-3: #7c8c83;
          --accent: #4cc58a;
          --accent-strong: #6fd5a2;
          --accent-ink: #06210f;
          --accent-soft: #173325;
          --warn: #e8b862;
          --warn-bg: #2f2610;
          --bad: #f0837b;
          --ok: #4cc58a;
          --s1: #4cc58a;
          --s2: #aebcb3;
          --fat: #5d6c63;
          --side: #0a0f0c;
          --side-ink: #d3e3d9;
          --side-dim: #7f9187;
          --side-line: #18221c;
          --side-on: #173325
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1411;
        --surface: #151c18;
        --surface-2: #1e2822;
        --tint: #173325;
        --line: #2a362e;
        --line-soft: #222d26;
        --ink: #e9f1ec;
        --ink-2: #aebcb3;
        --ink-3: #7c8c83;
        --accent: #4cc58a;
        --accent-strong: #6fd5a2;
        --accent-ink: #06210f;
        --accent-soft: #173325;
        --warn: #e8b862;
        --warn-bg: #2f2610;
        --bad: #f0837b;
        --ok: #4cc58a;
        --s1: #4cc58a;
        --s2: #aebcb3;
        --fat: #5d6c63;
        --side: #0a0f0c;
        --side-ink: #d3e3d9;
        --side-dim: #7f9187;
        --side-line: #18221c;
        --side-on: #173325
      }

      * {
        box-sizing: border-box
      }

      html {
        -webkit-text-size-adjust: 100%
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 "Segoe UI Variable Text", "SF Pro Text", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
        font-feature-settings: "tnum"1
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit
      }

      .app {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100vh
      }

      /* sidebar */
      .side {
        background: var(--side);
        color: var(--side-ink);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        display: flex;
        flex-direction: column;
        padding: 18px 12px;
        scrollbar-width: thin
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 8px 18px;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -.01em;
        color: #fff
      }

      .brand svg {
        width: 28px;
        height: 28px;
        flex: none
      }

      .grp {
        margin: 14px 8px 4px;
        color: var(--side-dim);
        font-size: 12px;
        font-weight: 600
      }

      .nb {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--side-ink);
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        text-align: left
      }

      .nb svg {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: .85
      }

      .nb:hover {
        background: var(--side-line)
      }

      .nb[aria-current="page"] {
        background: var(--side-on);
        color: #fff;
        box-shadow: inset 3px 0 0 var(--accent)
      }

      .side-foot {
        margin-top: auto;
        padding-top: 16px;
        display: grid;
        gap: 6px
      }

      .side-foot .nb {
        font-size: 13px;
        color: var(--side-dim)
      }

      .side-foot .nb:hover {
        color: var(--side-ink)
      }

      .mtop {
        display: none
      }

      /* main */
      main {
        padding: 26px 32px 56px;
        max-width: 1240px;
        width: 100%
      }

      .ph {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px 20px;
        margin-bottom: 20px
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0;
        font-weight: 650;
        letter-spacing: -.02em
      }

      .ph p {
        margin: 4px 0 0;
        color: var(--ink-2);
        max-width: 60ch
      }

      h2 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 650;
        letter-spacing: -.005em
      }

      h3 {
        font-size: 13px;
        margin: 16px 0 6px;
        font-weight: 650;
        color: var(--ink-2)
      }

      .tab {
        display: none
      }

      .tab.on {
        display: block
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        align-items: start
      }

      .panel,
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        min-width: 0
      }

      .card.wide,
      .panel.wide {
        grid-column: 1/-1
      }

      .row {
        display: grid;
        grid-template-columns: minmax(120px, 1.1fr) minmax(90px, 1fr);
        gap: 6px 12px;
        align-items: center;
        padding: 4px 0
      }

      .row>label,
      .row>.l {
        color: var(--ink-2)
      }

      .row .v {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        text-align: right
      }

      .row.big .v {
        font-size: 20px;
        letter-spacing: -.01em
      }

      input[type=number],
      input[type=text],
      input[type=date],
      select {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        width: 100%;
        min-width: 0;
        min-height: 34px
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px
      }

      input:disabled {
        background: var(--surface-2);
        color: var(--ink-2)
      }

      .btn {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        min-height: 34px
      }

      .btn:hover {
        background: var(--surface-2)
      }

      .btn.pri {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600
      }

      .btn.pri:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong)
      }

      .btn.sm {
        padding: 2px 9px;
        min-height: 28px;
        font-size: 13px
      }

      .note {
        color: var(--ink-3);
        font-size: 12.5px;
        margin: 8px 0 0;
        max-width: 80ch
      }

      .alert {
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        padding: 9px 12px;
        margin: 10px 0;
        font-size: 13px
      }

      .alert:empty {
        display: none
      }

      .tw {
        overflow: auto;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface)
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums
      }

      th,
      td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line-soft);
        text-align: right;
        white-space: nowrap
      }

      tbody tr:last-child td {
        border-bottom: 0
      }

      th {
        position: sticky;
        top: 0;
        background: var(--surface-2);
        font-weight: 600;
        color: var(--ink-2);
        font-size: 12.5px;
        z-index: 1
      }

      th:first-child,
      td:first-child,
      td.t,
      th.t {
        text-align: left
      }

      td input {
        padding: 4px 7px;
        min-width: 64px;
        min-height: 30px
      }

      td input.w-s {
        width: 72px
      }

      td input.w-xs {
        width: 60px
      }

      td input.w-m {
        width: 104px
      }

      td input.w-l {
        min-width: 240px
      }

      tr.tot td {
        font-weight: 650;
        background: var(--surface-2)
      }

      tr.sun td {
        background: color-mix(in srgb, var(--surface-2) 50%, transparent)
      }

      .bad {
        color: var(--bad)
      }

      .ok {
        color: var(--ok)
      }

      .mut {
        color: var(--ink-3)
      }

      .bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 0 0 12px
      }

      .bar label {
        color: var(--ink-2);
        display: flex;
        gap: 8px;
        align-items: center
      }

      .bar input[type=number],
      .bar input[type=text],
      .bar input[type=date] {
        width: auto
      }

      .meal {
        margin-bottom: 18px
      }

      .meal-h {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap
      }

      .meal-h input {
        max-width: 320px;
        font-weight: 600
      }

      td.unk input {
        border-color: var(--bad)
      }

      .tip {
        position: absolute;
        pointer-events: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12.5px;
        box-shadow: 0 4px 14px #0003;
        display: none;
        white-space: nowrap;
        z-index: 3
      }

      .chart {
        position: relative
      }

      .chart svg {
        width: 100%;
        height: auto;
        display: block;
        touch-action: pan-y
      }

      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--ink-2);
        margin-bottom: 8px
      }

      .legend i {
        display: inline-block;
        width: 18px;
        height: 0;
        border-top: 2px solid;
        vertical-align: middle;
        margin-right: 6px
      }

      /* dashboard */
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
        margin-bottom: 16px
      }

      .hero-main {
        background: var(--tint);
        border-radius: 14px;
        padding: 22px 22px 14px;
        min-width: 0
      }

      .lead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px
      }

      .lead .n {
        font-size: 52px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -.035em;
        font-variant-numeric: tabular-nums
      }

      .lead .u {
        font-size: 18px;
        color: var(--ink-2);
        margin-left: -8px
      }

      .lead .s {
        color: var(--ink-2);
        font-size: 14px
      }

      .track {
        margin: 24px 8px 8px;
        position: relative;
        height: 56px
      }

      .track .rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 20px;
        height: 8px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--ink) 14%, transparent)
      }

      .track .fill {
        position: absolute;
        left: 0;
        top: 20px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent)
      }

      .track .mk {
        position: absolute;
        top: 14px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        background: var(--surface);
        border: 3px solid var(--ink-2)
      }

      .track .mk.cur {
        border-color: var(--accent);
        background: var(--accent)
      }

      .track .lb {
        position: absolute;
        top: 36px;
        font-size: 12.5px;
        color: var(--ink-2);
        white-space: nowrap;
        transform: translateX(-50%)
      }

      .track .lb b {
        color: var(--ink);
        font-weight: 650
      }

      .track .lb.top {
        top: -4px
      }

      .track .lb.l {
        transform: none
      }

      .track .lb.r {
        transform: translateX(-100%)
      }

      .hero-main .chart {
        margin-top: 6px
      }

      .stats {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 6px 18px;
        align-self: stretch
      }

      .stat {
        padding: 11px 0;
        border-bottom: 1px solid var(--line-soft)
      }

      .stat:last-child {
        border-bottom: 0
      }

      .stat .k {
        color: var(--ink-2);
        font-size: 12.5px
      }

      .stat .n {
        font-size: 22px;
        font-weight: 620;
        letter-spacing: -.015em;
        line-height: 1.25;
        font-variant-numeric: tabular-nums
      }

      .stat .d {
        color: var(--ink-3);
        font-size: 12.5px
      }

      .trio {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        margin-bottom: 16px
      }

      .hb {
        display: grid;
        grid-template-columns: minmax(120px, 1.7fr) 2fr auto;
        gap: 4px 10px;
        align-items: center;
        padding: 3px 0;
        font-size: 13px
      }

      .hb .tr {
        height: 8px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden
      }

      .hb .tr i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 4px
      }

      .hb .vv {
        font-variant-numeric: tabular-nums;
        text-align: right;
        min-width: 48px
      }

      .seg {
        display: flex;
        height: 26px;
        border-radius: 6px;
        overflow: hidden;
        gap: 2px;
        margin: 6px 0 4px
      }

      .seg i {
        display: block;
        height: 100%
      }

      .seg-l {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--ink-2);
        margin-bottom: 12px
      }

      .attn {
        margin: 0;
        padding: 0;
        list-style: none
      }

      .attn li {
        padding: 8px 0 8px 14px;
        border-bottom: 1px solid var(--line-soft);
        position: relative
      }

      .attn li:last-child {
        border-bottom: 0
      }

      .attn li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 15px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warn)
      }

      .attn li.good::before {
        background: var(--accent)
      }

      .empty {
        color: var(--ink-3)
      }

      details.card summary {
        cursor: pointer;
        font-weight: 600
      }

      @media (max-width:1020px) {
        .hero {
          grid-template-columns: 1fr
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          column-gap: 20px
        }

        .stat {
          border-bottom: 1px solid var(--line-soft)
        }
      }

      @media (max-width:820px) {
        .app {
          grid-template-columns: 1fr
        }

        .side {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 272px;
          z-index: 20;
          transform: translateX(-100%);
          transition: transform .2s
        }

        .side.open {
          transform: none;
          box-shadow: 0 0 0 100vmax #0006
        }

        .mtop {
          display: flex;
          align-items: center;
          gap: 10px;
          position: sticky;
          top: 0;
          z-index: 10;
          background: var(--surface);
          border-bottom: 1px solid var(--line);
          padding: 10px 14px;
          font-weight: 650
        }

        .mtop button {
          background: none;
          border: 1px solid var(--line);
          border-radius: 8px;
          width: 38px;
          height: 38px;
          cursor: pointer
        }

        main {
          padding: 18px 14px 48px
        }

        .lead .n {
          font-size: 42px
        }

        .row {
          grid-template-columns: 1fr 1fr
        }
      }

      @media (prefers-reduced-motion:reduce) {
        .side {
          transition: none
        }
      }

      @media print {

        .side,
        .mtop,
        .bar button {
          display: none
        }

        .app {
          display: block
        }

        .tab {
          display: block !important;
          break-after: page
        }

        body {
          background: #fff
        }
      }
    </style>
  </head>
  <body>
    <div class="mtop"><button id="menu" aria-label="Open menu">☰</button><span>BioMetaCalc</span></div>
    <div class="app">
      <aside class="side" id="side">
        <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#1a7f45" />
            <path d="M6 21l6-7 5 4 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>BioMetaCalc</div>
        <nav id="nav" aria-label="Sections"></nav>
        <div class="side-foot"><input id="file" type="file" accept="application/json" hidden><button class="nb" data-act="theme"><svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg><span id="theme-l">Theme: system</span></button><button class="nb" data-act="export"><svg viewBox="0 0 24 24">
              <path d="M12 3v12M7 10l5 5 5-5M4 21h16" />
            </svg>Export data</button><button class="nb" data-act="import"><svg viewBox="0 0 24 24">
              <path d="M12 15V3M7 8l5-5 5 5M4 21h16" />
            </svg>Import data</button><button class="nb" data-act="reset"><svg viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5" />
            </svg>Restore sample data</button></div>
      </aside>
      <main id="main"></main>
    </div><datalist id="foodlist"></datalist>
    <script type="application/json" id="foods-data">
      [
        ["acciughe o alici", 96, 16.8, 1.5, 2.6, 0, "anchovies"],
        ["acciughe o alici in pasta", 194, 21.5, 0, 12, 0, "anchovy paste"],
        ["acciughe o alici sott'olio", 206, 25.9, 0.2, 11.3, 0, "anchovies in oil"],
        ["acciughe o alici sotto sale", 128, 25, 0, 3.1, 0, "anchovies, salted"],
        ["aceto", 4, 0.4, 0.6, 0, 0, "vinegar"],
        ["acqua", 0, 0, 0, 0, 0, "water"],
        ["acqua tonica", 33, 0, 8.8, 0, 0, "tonic water"],
        ["agar agar", 16, 1.6, 0, 1.2, 81.1, "agar agar"],
        ["aglio, fresco", 41, 0.9, 8.4, 0.6, 2.3, "garlic, fresh"],
        ["aglio, in polvere", 246, 18.7, 42.7, 1.2, 9.9, "garlic powder"],
        ["agnello", 162, 20.8, 0, 8.8, 0, "lamb"],
        ["agnello, carne grassa", 279, 18, 0, 23, 0, "lamb, fatty meat"],
        ["agnello, carne magra", 121, 20, 0, 4.6, 0, "lamb, lean meat"],

      let S;

      function load() {

      }
      /* ===== Foods index (English name, with the Italian original as an alias) ===== */
      let ALL = [],
        FMAP = new Map();

      function indexFoods() {
        ALL = FOODS.map(r => ({
          it: r[0],

          c: r[3],
          f: r[4],

        })).concat((S.customFoods || []).map((r, i) => ({
          n: r.n,
          it: "",
          k: r.k,

        })));

        });

        ["meals", "recipes"].forEach(k => (S[k] || []).forEach(m => m.rows.forEach(r => {
          const f = lookup(r.food);

        })));
      }
      const lookup = n => n ? FMAP.get(String(n).trim().toLowerCase()) || null : null;
      /* ===== Model ===== */
      let M = {};

      function calc() {
        const p = S.profile,
          g = S.goal,
          m = {};
        const h = num(p.height),
          w = num(p.weight),
          male = p.sex === "Male";
        m.male = male;
        m.age = ageFrom(p.birth);
        m.bmi = (w && h) ? w / Math.pow(h / 100, 2) : null;
        m.bmiCat = m.bmi == null ? "" : m.bmi < 18.5 ? "Underweight" : m.bmi < 25 ? "Normal weight" : m.bmi < 30 ? "Overweight" : "Obesity";
        if (h) {
          const lo = 18.5 * Math.pow(h / 100, 2),
            hi = 24.9 * Math.pow(h / 100, 2);
          m.ideal = [Math.round(lo * 10) / 10, Math.round(hi * 10) / 10];
          m.idealMid = Math.round((m.ideal[0] + m.ideal[1]) / 2)
        }
        // Body fat
        let navy = null;
        if (w && h && p.waist && p.neck && p.hip) {
          const x = male ? p.waist - p.neck : p.waist + p.hip - p.neck;
          if (x > 0) {
            navy = (male ? 495 / (1.0324 - 0.19077 * Math.log10(x) + 0.15456 * Math.log10(h)) - 450 : 495 / (1.29579 - 0.35004 * Math.log10(x) + 0.221 * Math.log10(h)) - 450) / 100
          }
        }
        const deur = (m.bmi != null && m.age != null) ? (1.2 * m.bmi + 0.23 * m.age - 10.8 * (male ? 1 : 0) - 5.4) / 100 : null;
        const mk = f => f == null || !w ? {
          fat: null,
          lean: null,
          leanKg: null,
          fatKg: null
        } : {
          fat: f,
          lean: 1 - f,
          leanKg: w * (1 - f),
          fatKg: w - w * (1 - f)
        };
        m.navy = mk(navy);
        m.deur = mk(deur);
        m.whr = (p.waist && p.hip) ? p.waist / p.hip : null;
        m.idealWaist = p.hip ? p.hip * (male ? 0.9 : 0.7) : null;
        m.waistLose = (m.idealWaist != null && p.waist) ? p.waist - m.idealWaist : null;
        // Basal metabolic rate
        const a = m.age;
        let bmr = [null, null, null, null];
        if (w && h && a != null) {
          bmr[0] = male ? w * 24 : w * 24 * 0.85;
          const t = male ? [
            [59, 12.3, 609],
            [29, 11.6, 879],
            [17, 15.3, 679],
            [10, 17.5, 651]
          ] : [
            [59, 9, 688],
            [29, 8.7, 829],
            [17, 14.7, 496],
            [10, 12.2, 746]
          ];
          const row = t.find(r => a > r[0]);
          bmr[1] = row ? row[1] * w + row[2] : 0;
          bmr[2] = male ? 66.473 + 13.7156 * w + 5.033 * h - 6.775 * a : 655.095 + 9.5634 * w + 1.849 * h - 4.6756 * a;
          bmr[3] = male ? 10 * w + 6.25 * h - CFG.mifflinMaleAge * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
        }
        m.bmr = bmr;
        m.bmrH = bmr.map(x => x == null ? null : x / 24);
        m.adjH = (m.bmrH[3] != null && m.navy.lean != null) ? m.bmrH[3] * m.navy.lean : null;
        m.adjD = m.adjH == null ? null : m.adjH * 24;
        m.actHours = ACTS.map(([n]) => S.schedule.filter(x => x === n).length);
        m.actM = ACTS.map(([n, c], i) => m.adjH == null ? null : m.actHours[i] * m.adjH * c);
        m.actF = m.actM.map(x => x == null ? null : x * 0.9);
        m.sumM = m.adjH == null ? null : sumArr(m.actM);
        m.sumF = m.adjH == null ? null : sumArr(m.actF);
        m.totHours = sumArr(m.actHours);
        m.need = (m.totHours === 24 && m.sumM != null) ? (male ? m.sumM : m.sumF) : null;
        // Goal
        const startN = dayN(g.start),
          endN = dayN(g.deadline),
          tn = todayN();
        m.startN = startN;
        m.startW = w;
        m.toLose = (w != null && num(g.target) != null) ? w - g.target : null;
        m.daysLeft = endN != null ? Math.round(endN - tn) : null;
        m.suggested = (m.need != null && m.toLose != null && m.daysLeft > 0) ? m.need - (m.toLose * CFG.kcalPerKg) / m.daysLeft : null;
        m.intake = num(g.intake);
        m.diff = (m.need != null && m.intake != null) ? m.need - m.intake : null;
        m.perDay = m.diff == null ? null : m.diff / CFG.kcalPerKg;
        m.dur = (m.diff != null && m.diff > 0 && m.toLose != null) ? Math.round(m.toLose * CFG.kcalPerKg / m.diff) : null;
        m.endPlan = (m.dur != null && startN != null) ? startN + m.dur : null;
        // Weights (carry-forward)
        const ws = [];
        Object.keys(S.days).forEach(k => {
          const v = S.days[k];
          if (v && num(v.w) != null) ws.push([dayN(k), +v.w])
        });
        ws.sort((x, y) => x[0] - y[0]);
        m.weights = ws;
        m.wOn = n => {
          if (startN != null && n <= startN) return w;
          let r = w;
          for (const [d, v] of ws) {
            if (d <= n) r = v;
            else break
          }
          return r
        };
        m.latestW = ws.length ? ws[ws.length - 1][1] : w;
        m.lastEntryN = ws.length ? ws[ws.length - 1][0] : startN;
        // Diary range
        const keys = Object.keys(S.days).map(dayN).filter(x => x != null);
        const maxN = Math.max(startN != null ? startN + Math.max(5, num(S.diaryDays) || 180) - 1 : 0, ...keys);
        m.N = startN != null ? Math.min(1500, maxN - startN + 1) : 0;
        m.lost = (w != null && m.latestW != null) ? w - m.latestW : null;
        m.elapsed = startN != null ? tn - startN : null;
        return m;
      }
      /* ===== UI helpers ===== */

      /* ===== Chart (weight over time) ===== */
      function diaryModel() {
        const rows = [];
        if (M.startN == null) return rows;
        let prev = null;
        for (let i = 0; i < M.N; i++) {
          const n = M.startN + i,
            k = isoOf(n),
            d = S.days[k] || {};
          const w = i === 0 ? M.startW : num(d.w);
          const t = (M.perDay != null && M.startW != null) ? M.startW - i * M.perDay : null;

          const fat = (bmi != null && M.age != null) ? (1.2 * bmi + 0.23 * M.age - 10.8 * (M.male ? 1 : 0) - 5.4) / 100 : null;
          rows.push({
            i,
            n,
            k,
            w,
            t,
            diff: (w != null && t != null) ? t - w : null,
            daily: (w != null && prev != null && i > 0) ? prev - w : null,
            bmi,
            fat
          });
          if (w != null) prev = w;
        }
        return rows;
      }

      function drawChart(all, box, compact) {
        if (!box) return;
        const W = Math.max(300, Math.round(box.clientWidth) || 760),
          small = W < 560,
          H = small ? 240 : 300,
          ml = small ? 34 : 44,
          mr = small ? 52 : 78,
          mt = 12,
          mb = 28,
          pw = W - ml - mr,
          ph = H - mt - mb;
        const lastI = Math.max(0, ...all.filter(r => r.w != null).map(r => r.i));
        const rows = all.slice(0, Math.min(all.length, Math.max(lastI + 30, Math.round(lastI * 1.5)) + 1));
        const N = rows.length;
        if (N < 2 || M.startW == null) {
          box.innerHTML = '<p class="note">Add a start date and weight to see the chart.</p>';
          return
        }
        const tgt = num(S.goal.target);
        const theory = rows.filter(r => r.t != null && (tgt == null || r.t >= tgt - 0.0001));
        const vals = [...rows.filter(r => r.w != null).map(r => r.w), ...theory.map(r => r.t)];
        if (tgt != null) vals.push(tgt);
        const lo = Math.floor(Math.min(...vals) - 1),
          hi = Math.ceil(Math.max(...vals) + 1);
        const X = i => ml + i / (N - 1) * pw,
          Y = v => mt + (hi - v) / (hi - lo) * ph;
        const step = (hi - lo) > 40 ? 10 : (hi - lo) > 16 ? 5 : 2;
        let g = "";
        for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-opacity=".7"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end" fill="var(--ink-3)" font-size="11.5">${v}</text>`;
        const nt = Math.min(small ? 3 : 5, N - 1);
        for (let j = 0; j <= nt; j++) {
          const i = Math.round(j * (N - 1) / nt);
          g += `<text x="${X(i)}" y="${H-8}" text-anchor="${j===0?"start":j===nt?"end":"middle"}" fill="var(--ink-3)" font-size="11.5">${dshort(rows[i].n)}</text>`
        }
        const pathOf = a => a.map((r, j) => (j ? "L" : "M") + X(r.i).toFixed(1) + " " + Y(r.v).toFixed(1)).join("");
        const act = rows.filter(r => r.w != null).map(r => ({
            i: r.i,

          })),

            i: r.i,
            v: r.t
          }));
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time: actual, planned and target">${g}`;
        if (tgt != null) s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--ink-3)" stroke-dasharray="2 4"/><text x="${W-mr+8}" y="${Y(tgt)+4}" fill="var(--ink-2)" font-size="12">${small?nf(tgt,0):"Target "+nf(tgt,1)}</text>`;
        if (th.length > 1) s += `<path d="${pathOf(th)}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/>`;
        if (act.length) s += `<path d="${pathOf(act)}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` + act.map(p => `<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`).join("");
        if (act.length) {

          s += `<text x="${X(l.i)+9}" y="${Y(l.v)-9}" fill="var(--ink)" font-size="12" font-weight="600">${nf(l.v,1)}</text>`

        s += `<line class="xh" y1="${mt}" y2="${H-mb}" stroke="var(--ink-3)" style="display:none"/><rect class="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip"></div>`;
        box.innerHTML = s;
        const svg = $("svg", box),

      const LEGEND = `<div class="legend"><span><i style="border-color:var(--s1);border-top-width:3px"></i>Actual weight</span><span><i style="border-color:var(--s2);border-top-style:dashed"></i>Planned weight</span><span><i style="border-color:var(--ink-3);border-top-style:dotted"></i>Target</span></div>`;

      /* ===== Heart rate ===== */
      const tabHR = {

${FC_MAX.map((z,i)=>`<tr><td>${z[0]}–${z[1]}%</td><td>${O("c-a"+i)}</td><td>${O("c-b"+i)}</td><td class="t">${z[2]}</td></tr>`).join("")}</table></div></div><div class="card wide"><h2>Zones by percentage of heart rate reserve</h2><div class="tw"><table><tr><th class="t">% of reserve</th><th>Rate I</th><th>Rate II</th><th class="t">Training type</th></tr>
${FC_RIS.map((z,i)=>`<tr><td>${z[0]}–${z[1]}%</td><td>${O("c-c"+i)}</td><td>${O("c-d"+i)}</td><td class="t">${FC_MAX[i][2]}</td></tr>`).join("")}</table></div><p class="note">Requires at least one resting heart rate measurement.</p></div><div class="card wide"><h2>Safe training ranges</h2><div class="tw"><table><tr><th class="t">Training type</th><th>Min</th><th>Max</th><th>Average</th></tr>

        html: () => `<div class="grid"><div class="card"><h2>Activity calculator</h2>
${ROW("Weight (kg), latest logged",O("n-w"))}${ROW("Minutes of activity",I("consumo.minutes"))}${ROW("Activity",SEL("consumo.activity",[["","Choose…"]].concat(SPORTS.map(s=>s[0]))))}
${ROW("Calories burned",O("n-k"),"big")}${ROW("Weight lost (g)",O("n-g"))}
<p class="note">kcal = weight × minutes × coefficient × lean-mass fraction (Deurenberg). Weight lost = kcal / 8.</p></div><div class="card"><h2>The health walk</h2>${ROW("Kilometres walked",I("consumo.km"))}${ROW("Calories burned",O("n-wk"))}${ROW("Fat lost",O("n-wf"))}
<p class="note">kcal = km × weight × 0.9; fat = kcal / 20 (the unit isn't stated in the original workbook).</p></div><div class="card wide"><h2>Calories and weight lost in one hour, by body weight</h2><div class="tw" style="max-height:60vh"><table><thead><tr><th class="t">Activity</th><th>Calories/hour</th><th>Weight lost/hour (g)</th><th>Coefficient</th></tr></thead><tbody>

        html: () => `<div class="grid"><div class="card"><h2>Block calculation</h2>
${ROW("Lean mass (kg, Deurenberg)",O("z-lean"))}${ROW("Activity index",SEL("zone.index",ZONE_IDX.map(z=>[z[0],z[0].toLocaleString("en-GB",{minimumFractionDigits:1})+" – "+z[1]])))}
${ROW("Protein needed",O("z-prot"),"big")}${ROW("Blocks per day",I("zone.blocks"))}<p class="note" id="z-hint"></p></div><div class="card"><h2>Daily split</h2><div class="tw"><table><tr><th class="t"></th><th>g</th><th>kcal</th></tr><tr><td>Protein</td><td>${O("z-pg")}</td><td>${O("z-pc")}</td></tr><tr><td>Carbohydrates</td><td>${O("z-cg")}</td><td>${O("z-cc")}</td></tr><tr><td>Fat</td><td>${O("z-fg")}</td><td>${O("z-fc")}</td></tr><tr class="tot"><td>Total</td><td></td><td>${O("z-tot")}</td></tr></table></div><p class="note">One block = 7 g protein, 9 g carbohydrates, 1.5 g fat. Energy: protein 3.75, carbohydrates 4, fat 9 kcal/g.</p></div></div>`,
        update() {

      /* ===== Meal and recipe calculators ===== */
      function ingRow(kind, i, j, rec) {

      }

      function updIng(kind) {
        const rec = kind === "recipes",
          tx = (el, i, t) => {

          };
        S[kind].forEach((m, i) => {

            }
            const q = g / 100,
              k = f.k * q,

            const v = [nf(k), nf(p, 1), nf(c, 1), nf(fa, 1)];

      }
      const mkIngTab = (kind, id, title, desc, addLabel, icon) => ({

      const tabRecipes = mkIngTab("recipes", "recipes", "Recipe calculator", "Totals for a recipe and values per 100 g of the finished dish, fibre included.", "New recipe", '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5"/>');
      /* ===== Food database ===== */
      let fSort = {

        html: () => `<div class="bar"><label>Search <input type="text" id="fq" placeholder="e.g. chicken or pollo" style="width:240px" autocomplete="off"></label><span class="note" id="fcount" style="margin:0"></span></div><details class="card" style="margin-bottom:14px"><summary>Add a custom food (values per 100 g)</summary><div class="bar" style="margin-top:12px"><input type="text" id="a-n" placeholder="Name" style="width:220px"><input type="number" step="any" id="a-k" placeholder="kcal" style="width:90px"><input type="number" step="any" id="a-p" placeholder="Protein" style="width:90px"><input type="number" step="any" id="a-c" placeholder="Carbs" style="width:90px"><input type="number" step="any" id="a-f" placeholder="Fat" style="width:90px"><input type="number" step="any" id="a-fi" placeholder="Fibre" style="width:90px"><button class="btn pri" data-act="addCustom">Add food</button></div></details><div class="tw" style="max-height:72vh"><table><thead><tr>${FCOLS.map(c=>`<th class="${c[2]||""}" data-sort="${c[0]}" style="cursor:pointer" title="Sort by ${c[1].toLowerCase()}">${c[1]}</th>`).join("")}<th></th></tr></thead><tbody id="foods-body"></tbody></table></div><p class="note">Zone blocks: protein ÷ 7, carbohydrates ÷ 9, fat ÷ 3 (rounded); points = kcal ÷ 3.6.</p>`,
        build() {
          const q = fQ.trim().toLowerCase();
          let a = ALL.filter(f => !q || f.n.toLowerCase().includes(q) || (f.it || "").toLowerCase().includes(q));
          const val = f => fSort.k === "n" ? f.n.toLowerCase() : fSort.k === "it" ? (f.it || "").toLowerCase() : fSort.k === "zp" ? f.p / 7 : fSort.k === "zc" ? f.c / 9 : fSort.k === "zg" ? f.f / 3 : fSort.k === "pt" ? f.k / 3.6 : f[fSort.k];

      let cur = "overview";
      const activeTab = () => TABS.find(t => t.id === cur);

      function refresh() {
        M = calc();
        const t = activeTab();
        if (t && t.update) t.update()
      }

      function applyTheme() {
        const t = S.theme || "system",
          r = document.documentElement;
        if (t === "system") r.removeAttribute("data-theme");
        else r.setAttribute("data-theme", t);
        const l = document.getElementById("theme-l");
        if (l) l.textContent = "Theme: " + t
      }

      function renderNav() {
        let h = "",
          g = null;
        TABS.forEach(t => {
          if (t.group !== g) {
            g = t.group;
            if (g) h += `<div class="grp">${g}</div>`
          }
          h += `<button class="nb" data-tab="${t.id}"${t.id===cur?' aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg>${t.title}</button>`
        });
        $("#nav").innerHTML = h
      }

      function renderAll() {
        indexFoods();
        M = calc();
        applyTheme();
        renderNav();
        $("#main").innerHTML = TABS.map(t => `<section class="tab${t.id===cur?" on":""}" id="tab-${t.id}" aria-label="${esc(t.title)}"><header class="ph"><div><h1>${t.title}</h1><p>${t.desc}</p></div></header>${t.html()}</section>`).join("");
        buildRanges();
        TABS.forEach(t => t.build && t.build());
        refresh();
      }

      function go(id) {
        cur = id;
        renderNav();
        $$(".tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + id));
        $("#side").classList.remove("open");
        try {
          history.replaceState(null, "", "#" + id)
        } catch (e) {}
        refresh();
        window.scrollTo(0, 0);
        document.title = (id === "overview" ? "" : activeTab().title + " · ") + "BioMetaCalc"
      }
      document.addEventListener("input", e => {
        const t = e.target;
        if (t.id === "fq") {
          fQ = t.value;
          tabFoods.build();
          return
        }
        const p = t.dataset && t.dataset.p;
        if (!p) return;
        const ty = t.dataset.t;
        let v = ty === "n" ? num(t.value) : (ty === "d" ? (t.value || null) : t.value);
        if (ty === "n" && v != null && p === "diaryDays" && v < 1) v = 1;
        setP(S, p, ty === "s" && /^days\./.test(p) && v === "" ? null : v);
        save();
        if (p === "goal.start" || p === "diaryDays") buildRanges();
        refresh()
      });
      document.addEventListener("click", e => {
        const th = e.target.closest("th[data-sort]");
        if (th) {
          const k = th.dataset.sort;
          fSort = fSort.k === k ? {
            k,
            dir: -fSort.dir
          } : {
            k,
            dir: 1
          };
          tabFoods.build();
          return
        }
        const nb = e.target.closest("[data-tab]");
        if (nb) {
          go(nb.dataset.tab);
          return
        }
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const a = b.dataset.act,
          i = +b.dataset.i,
          j = +b.dataset.j,
          kind = b.dataset.kind;
        const blank = n => Array.from({
          length: n
        }, () => ({
          food: "",
          g: null
        }));
        switch (a) {
          case "theme": {
            const o = ["system", "light", "dark"];
            S.theme = o[(o.indexOf(S.theme || "system") + 1) % 3];
            applyTheme();
            save();
            return
          }
          case "export": {
            const blob = new Blob([JSON.stringify(S, null, 1)], {
                type: "application/json"
              }),
              u = URL.createObjectURL(blob),
              l = document.createElement("a");
            l.href = u;
            l.download = "biometacalc-data-" + isoOf(todayN()) + ".json";
            l.click();
            setTimeout(() => URL.revokeObjectURL(u), 1000);
            return
          }
          case "import":
            $("#file").click();
            return;
          case "reset":
            if (confirm("Restore the sample data? Anything you entered will be replaced.")) {
              S = defaults();
              save();
              renderAll()
            }
            return;
          case "useLatest":
            S.profile.weight = M.latestW;
            save();
            renderAll();
            return;
          case "addRun":
            S.runs.push({
              date: isoOf(todayN()),
              km: null,
              time: ""
            });
            tabRuns.build();
            break;
          case "delRun":
            S.runs.splice(i, 1);
            tabRuns.build();
            break;
          case "addMeal":
            S[kind].push({
              name: "",
              rows: blank(kind === "recipes" ? 15 : 10)
            });
            buildIng(kind);
            break;
          case "delMeal":
            if (confirm("Delete this table?")) {
              S[kind].splice(i, 1);
              buildIng(kind)
            }
            break;
          case "addIng":
            S[kind][i].rows.push({
              food: "",
              g: null
            });
            buildIng(kind);
            break;
          case "delIng":
            S[kind][i].rows.splice(j, 1);
            buildIng(kind);
            break;
          case "addCustom": {
            const n = ($("#a-n").value || "").trim(),
              f = id => num($("#" + id).value);
            if (!n || f("a-k") == null) {
              alert("Enter at least a name and the calories.");
              return
            }
            if (FMAP.has(n.toLowerCase())) {
              alert("A food with this name already exists.");
              return
            }
            S.customFoods.push({
              n,
              k: f("a-k"),
              p: f("a-p") || 0,
              c: f("a-c") || 0,
              f: f("a-f") || 0,
              fi: f("a-fi") || 0
            });
            save();
            indexFoods();
            tabFoods.build();
            ["a-n", "a-k", "a-p", "a-c", "a-f", "a-fi"].forEach(id => $("#" + id).value = "");
            return
          }
          case "delCustom":
            S.customFoods.splice(i, 1);
            save();
            indexFoods();
            tabFoods.build();
            refresh();
            return;
        }
        save();
        refresh()
      });
      let rz;
      window.addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(refresh, 150)
      });
      $("#menu").addEventListener("click", () => $("#side").classList.toggle("open"));
      $("#file").addEventListener("change", e => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const o = JSON.parse(r.result);
            if (!o || typeof o !== "object" || !o.profile || !o.goal) throw 0;
            S = migrate(Object.assign(defaults(), o));
            save();
            renderAll()
          } catch (x) {
            alert("This file isn't a valid BioMetaCalc export.")
          }
        };
        r.readAsText(f);
        e.target.value = ""
      });
      S = load(); {
        const h = location.hash.slice(1);
        if (TABS.some(t => t.id === h)) cur = h
      }
      renderAll();
    </script>
  </body>
</html>
